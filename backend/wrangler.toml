name = "clan-suite"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Screenshots are cleared out a month after a challenge ends; see SHOT_RETENTION_DAYS. Daily is plenty
# for something measured in months, and 04:00 UTC is the small hours in Britain and the quiet end of
# the evening in Australia.
[triggers]
# The daily one clears out expired screenshots. The frequent one announces events about to start and
# results just after they finish, which is only worth doing at about the granularity people notice.
crons = ["0 4 * * *", "*/5 * * * *"]

# Clan Suite gets its own worker and its own database, deliberately.
#
# Boss of the Week is a separate, published plugin with players using it right now, and it runs from
# the `botw` worker against the `botw` database. Deploying this on top of those would replace a live
# service and migrate a live database out from under it. Clan Suite carries its own copy of the Boss
# of the Week tables instead, because it includes that event type.
#
# Created with `wrangler d1 create clan-suite`; put the id it prints below. `wrangler d1 list` has it
# if it is ever lost. Set up a new database with `wrangler d1 execute clan-suite --remote --file
# ./schema.sql`, which is complete on its own and safe to re-run.
[[d1_databases]]
binding = "DB"
database_name = "clan-suite"
database_id = "REPLACE-ME-WITH-THE-ID-FROM-wrangler-d1-create-clan-suite"
